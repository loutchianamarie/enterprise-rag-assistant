[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-assistant"
version = "0.1.0"
description = "Document-grounded question answering over synthetic sample documents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
